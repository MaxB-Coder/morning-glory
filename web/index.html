<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <!-- Content-Security-Policy.
       Blocks the whole class of attack where injected markup runs script:
       no inline script blocks, no inline event handlers (onerror=...), and
       scripts only from this origin plus Google's SDK host.

       Notes on the two loose-looking entries:
       * 'wasm-unsafe-eval' — required to instantiate Pyodide's WebAssembly.
       * 'unsafe-eval' — Pyodide's Emscripten glue builds functions at runtime.
         It weakens protection against eval-based payloads, but injected HTML
         and attributes are still inert, which is the realistic vector here.
       * style 'unsafe-inline' — the app uses a handful of style="" attributes.

       IF SIGN-IN OR THE ENGINE BREAKS: delete this single meta tag, redeploy,
       and tell me which one failed — nothing else depends on it.
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' https://www.gstatic.com https://apis.google.com 'wasm-unsafe-eval' 'unsafe-eval';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data:;
    font-src 'self';
    connect-src 'self' https://*.googleapis.com https://www.gstatic.com https://apis.google.com
                https://securetoken.googleapis.com wss://*.firebaseio.com;
    frame-src https://morningglory89.firebaseapp.com https://accounts.google.com
              https://apis.google.com;
    worker-src 'self' blob:;
    manifest-src 'self';
    object-src 'none';
    base-uri 'self';
    form-action 'self' https://morningglory89.firebaseapp.com https://accounts.google.com;
  " />

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- iOS standalone paints a strip BELOW the web viewport (where Safari's
       toolbar would be). No CSS can reach it. Its colour appears to be fixed
       when the app is added to the home screen, so it must never change: in
       dark mode it is #1c1714, and the bottom bar is given that same colour in
       theme.css so the two read as one footer. Changing this value, or the
       manifest's, strands a mismatched band under the tabs on every existing
       install. -->
  <meta name="theme-color" content="#f4ecdf" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1c1714" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#1c1714" />
  <title>Morning Glory</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="./css/pico.min.css" />
  <link rel="stylesheet" href="./css/app.css" />
  <link rel="stylesheet" href="./css/theme.css" />
  <!-- Pyodide loader — vendored for offline. Run scripts/fetch_pyodide.sh once. -->
  <script src="./vendor/pyodide/pyodide.js"></script>
</head>
<body>
  <div id="boot" class="boot">
    <h2>Morning Glory</h2>
    <p id="boot-status">Warming up the grinder…</p>
    <progress></progress>
  </div>

  <header class="app-header" hidden>
    <strong>Morning Glory</strong>
  </header>

  <main id="view" hidden></main>

  <nav class="bottom-nav" hidden>
    <a href="#/" data-nav>Home</a>
    <a href="#/history" data-nav>History</a>
    <a href="#/settings" data-nav>Settings</a>
  </nav>

  <script type="module" src="./js/app.js"></script>
  <script src="./js/sw-register.js"></script>
</body>
</html>
