<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- iOS standalone paints the strip BELOW the web viewport (where Safari's
       toolbar would be) using theme-color. It must match the bottom nav's
       background exactly, or it shows up as a coloured band under the nav
       that no CSS can reach — the viewport simply doesn't extend there. -->
  <meta name="theme-color" content="#fbf7f2" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1c1714" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#1c1714" />
  <title>Morning Glory</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="./css/pico.min.css" />
  <link rel="stylesheet" href="./css/app.css" />
  <!-- Pyodide loader — vendored for offline. Run scripts/fetch_pyodide.sh once. -->
  <script src="./vendor/pyodide/pyodide.js"></script>
</head>
<body>
  <div id="boot" class="boot">
    <div class="boot-logo">☕</div>
    <h2>Morning Glory</h2>
    <p id="boot-status">Warming up the grinder…</p>
    <progress></progress>
  </div>

  <header class="app-header" hidden>
    <strong>☕ Morning Glory</strong>
    <span>
      <span id="sync-badge" class="badge" hidden></span>
      <span id="engine-badge" class="badge">engine: loading</span>
    </span>
  </header>

  <main id="view" hidden></main>

  <nav class="bottom-nav" hidden>
    <a href="#/" data-nav>Home</a>
    <a href="#/history" data-nav>History</a>
    <a href="#/settings" data-nav>Settings</a>
  </nav>

  <script type="module" src="./js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () =>
        navigator.serviceWorker.register("./sw.js").catch(console.warn));
    }
  </script>
</body>
</html>
